<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!--ROBOTS-->
<meta name="theme-color" content="#0a0b0c">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
<!--BOOT-->
</head>
<body>
<!--HEADER-->
<main id="main" class="wrap">
  <div class="form-page wide">
    <h1>Checkout</h1>
    <p class="lede">One page, a few details. We confirm your order with you on WhatsApp.</p>
    <ol class="progress" aria-label="Progress">
      <li class="done" id="p1">1. Your device</li>
      <li class="now" id="p2">2. Your details</li>
      <li id="p3">3. Confirmed</li>
    </ol>

    <!-- Form is rendered by script from embedded data, but the structure below is plain HTML so it paints immediately -->
    <div id="co-root">
      <div class="co">
        <div class="skel" style="height:360px"></div>
        <div class="skel" style="height:200px"></div>
      </div>
    </div>
    <noscript><p class="err show">Checkout needs JavaScript. Please WhatsApp us on 071 662 3565 to order.</p></noscript>
  </div>
</main>
<!--FOOTER-->

<script src="/js/site.js"></script>
<script>
(function () {
  var T = window.TTM, $ = function (id) { return document.getElementById(id); };
  var product = null, providers = [];
  var PROVINCES = ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'North West', 'Northern Cape', 'Western Cape'];

  function setStep(n) {
    ['p1', 'p2', 'p3'].forEach(function (id, i) { $(id).className = i + 1 < n ? 'done' : (i + 1 === n ? 'now' : ''); });
  }

  function render() {
    var p = product, sold = T.isSold(p), g = T.gradeBadge(p);
    var cardLive = providers.some(function (x) { return x.key === 'yoco' && x.live; });
    $('co-root').innerHTML =
      '<form class="co" id="co-form" novalidate>' +
        '<div style="display:grid;gap:18px">' +
          '<section class="box"><h2>Delivery</h2>' +
            '<div class="choice" id="ful">' +
              '<label><input type="radio" name="fulfillmentMethod" value="delivery" checked><span>Courier Guy delivery<small>2-day delivery to your South African address</small></span></label>' +
              '<label><input type="radio" name="fulfillmentMethod" value="collection"><span>Collection<small>Arranged with us on WhatsApp</small></span></label>' +
            '</div>' +
            '<div id="addr" style="margin-top:16px">' +
              '<div class="field"><label for="c-line1">Street address</label><input id="c-line1" name="line1" autocomplete="address-line1" placeholder="Street and number, unit or complex"></div>' +
              '<div class="field"><label for="c-line2">Suburb (optional)</label><input id="c-line2" name="line2" autocomplete="address-line2"></div>' +
              '<div class="row2"><div class="field"><label for="c-city">City</label><input id="c-city" name="city" autocomplete="address-level2"></div>' +
              '<div class="field"><label for="c-post">Postal code</label><input id="c-post" name="postalCode" inputmode="numeric" autocomplete="postal-code" maxlength="4"></div></div>' +
              '<div class="field"><label for="c-prov">Province</label><select id="c-prov" name="province" autocomplete="address-level1"><option value="">Select province</option>' +
                PROVINCES.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
            '</div>' +
          '</section>' +
          '<section class="box"><h2>Your details</h2>' +
            '<div class="field"><label for="c-name">Full name</label><input id="c-name" name="name" autocomplete="name" required></div>' +
            '<div class="row2"><div class="field"><label for="c-phone">Phone (WhatsApp)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel" placeholder="082 123 4567" required></div>' +
            '<div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div></div>' +
            '<div class="field" style="margin-bottom:0"><label for="c-notes">Anything we should know? (optional)</label><textarea id="c-notes" name="notes"></textarea></div>' +
          '</section>' +
          '<section class="box"><h2>How would you like to pay?</h2>' +
            '<div class="choice">' +
              '<label><input type="radio" name="pay" value="card" checked><span>Card (via Yoco)<small>' + (cardLive ? 'You will be taken to a secure payment page' : 'We send you a secure payment link on WhatsApp') + '</small></span></label>' +
              '<label><input type="radio" name="pay" value="eft"><span>EFT / bank transfer<small>We send our bank details on WhatsApp</small></span></label>' +
              '<label><input type="radio" name="pay" value="cash"><span>Cash on collection<small>Pay when you collect (arranged on WhatsApp)</small></span></label>' +
            '</div>' +
          '</section>' +
        '</div>' +
        '<aside class="box" style="position:sticky;top:84px"><h2>Order summary</h2>' +
          '<div class="summary"><div class="thumb">' + T.media(p, true) + '</div><div>' +
            '<strong>' + T.esc(p.brand + ' ' + p.model) + '</strong><div class="card-sub">' + T.esc([p.storage, p.color].filter(Boolean).join(' · ')) + '</div>' +
            '<div class="badges" style="margin-top:6px"><span class="badge ' + g.cls + '">' + T.esc(g.text) + '</span><span class="badge badge-warranty">' + T.esc(T.warrantyBadge(p)) + '</span></div></div></div>' +
          (sold ? '<p class="stock low" style="margin-top:12px">This device is currently out of stock. You can still order it as a pre-order and we will confirm availability on WhatsApp.</p>' : '') +
          '<div class="totals"><div><span>Device</span><span>' + T.money(p.price) + '</span></div>' +
            '<div id="del-row"><span>Delivery (The Courier Guy)</span><span><span class="placeholder">[PLACEHOLDER: fee confirmed on WhatsApp]</span></span></div>' +
            '<div class="total"><span>Total</span><span>' + T.money(p.price) + '</span></div></div>' +
          '<button class="btn btn-primary btn-block" type="submit" data-ch="whatsapp" style="margin-top:18px">Place order and continue on WhatsApp</button>' +
          '<button class="btn btn-ghost btn-block" type="submit" data-ch="email" style="margin-top:10px">Place order by email</button>' +
          '<p class="err" id="co-err" role="alert"></p>' +
          '<p class="card-sub" style="margin-top:12px">Placing the order saves it with us and opens WhatsApp (or your email) with the details filled in. Just press send.</p>' +
        '</aside>' +
      '</form>';

    var form = $('co-form'), channel = 'whatsapp';
    form.querySelectorAll('button[type=submit]').forEach(function (b) { b.addEventListener('click', function () { channel = b.dataset.ch; }); });

    function syncFulfil() {
      var col = form.fulfillmentMethod.value === 'collection';
      $('addr').hidden = col; $('del-row').hidden = col;
    }
    form.addEventListener('change', function (e) {
      // Cash on collection only makes sense with collection
      if (e.target.name === 'pay' && e.target.value === 'cash') form.querySelector('input[name=fulfillmentMethod][value=collection]').checked = true;
      if (e.target.name === 'fulfillmentMethod' && e.target.value === 'delivery' && form.pay.value === 'cash') form.querySelector('input[name=pay][value=card]').checked = true;
      syncFulfil();
    });
    syncFulfil();

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('co-err'); err.classList.remove('show');
      var d = {}; new FormData(form).forEach(function (v, k) { d[k] = typeof v === 'string' ? v.trim() : v; });
      var delivery = d.fulfillmentMethod === 'delivery';
      var msg = '';
      if (!d.name) msg = 'Please enter your name.';
      else if (!d.phone || d.phone.replace(/\D/g, '').length < 9) msg = 'Please enter a valid phone number.';
      else if (!/^\S+@\S+\.\S+$/.test(d.email || '')) msg = 'Please enter a valid email address.';
      else if (delivery && (!d.line1 || !d.city || !/^\d{4}$/.test(d.postalCode || ''))) msg = 'Please enter your street address, city and 4-digit postal code.';
      if (msg) { err.textContent = msg; err.classList.add('show'); err.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }

      var btns = form.querySelectorAll('button[type=submit]'); btns.forEach(function (b) { b.disabled = true; });
      var body = {
        productId: product.id, name: d.name, email: d.email, phone: d.phone, notes: d.notes,
        fulfillmentMethod: d.fulfillmentMethod, paymentPreference: d.pay,
        paymentMethod: d.pay === 'card' && cardLive ? 'yoco' : 'manual',
        address: delivery ? { line1: d.line1, line2: d.line2, city: d.city, postalCode: d.postalCode, province: d.province } : undefined
      };
      try {
        var r = await T.api('/api/checkout', { method: 'POST', body: body });
        if (r.redirectUrl) { location.href = r.redirectUrl; return; }
        done(r, channel);
      } catch (ex) {
        err.textContent = ex.message; err.classList.add('show'); btns.forEach(function (b) { b.disabled = false; });
      }
    });
  }

  function done(r, channel) {
    setStep(3);
    var url = channel === 'email' ? r.mailtoUrl : r.whatsappUrl, ref = r.order.id.slice(0, 8);
    $('co-root').innerHTML =
      '<div class="box ok-box"><div class="tick">' + T.I.tick + '</div><h1>Order placed</h1>' +
      '<p>Thank you. Your order reference is <strong>' + T.esc(ref) + '</strong>. ' + (r.preOrder ? 'This device is a pre-order, so we will confirm availability with you. ' : '') +
      'Press send in ' + (channel === 'email' ? 'your email app' : 'WhatsApp') + ' so we can confirm payment and delivery.</p>' +
      '<a class="btn btn-primary btn-block" id="open-ch" data-custom ' + (channel === 'email' ? '' : 'data-wa target="_blank" rel="noopener"') + ' href="' + T.esc(url) + '">' + (channel === 'email' ? 'Open email' : 'Open WhatsApp') + '</a>' +
      '<p style="margin-top:14px"><a class="link-arrow" href="/">Back to the shop</a></p></div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // Direct navigation (not window.open) so mobile popup blockers cannot stop it; the button above is the fallback.
    setTimeout(function () { location.href = url; }, 700);
  }

  function missing() {
    $('co-root').innerHTML = '<div class="box ok-box"><h1>Pick a device first</h1><p>We could not find that device. It may have sold.</p><a class="btn btn-primary" href="/#shop">Shop devices</a></div>';
  }

  var b = T.boot || {};
  providers = b.providers || [];
  function go(p) { product = p; render(); T.track('checkout_started', { productId: p.id }); }
  if (b.product) go(b.product);
  else {
    var id = b.id || new URLSearchParams(location.search).get('id');
    if (!id) missing();
    else T.api('/api/products/' + encodeURIComponent(id)).then(go).catch(missing);
  }
})();
</script>
</body>
</html>
