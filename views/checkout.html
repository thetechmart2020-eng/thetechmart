<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!--ROBOTS-->
<meta name="theme-color" content="#0a0b0c">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
<!--BOOT-->
</head>
<body>
<!--HEADER-->
<main id="main" class="wrap">
  <div class="form-page wide">
    <h1>Checkout</h1>
    <p class="lede">One page, a few details. We confirm your order with you on WhatsApp.</p>
    <ol class="progress" aria-label="Progress">
      <li class="done" id="p1">1. Your device</li>
      <li class="now" id="p2">2. Your details</li>
      <li id="p3">3. Confirmed</li>
    </ol>

    <!-- Form is rendered by script from embedded data, but the structure below is plain HTML so it paints immediately -->
    <div id="co-root">
      <div class="co">
        <div class="skel" style="height:360px"></div>
        <div class="skel" style="height:200px"></div>
      </div>
    </div>
    <noscript><p class="err show">Checkout needs JavaScript. Please WhatsApp us on 071 662 3565 to order.</p></noscript>
  </div>
</main>
<!--FOOTER-->

<script src="/js/site.js"></script>
<script>
(function () {
  var T = window.TTM, $ = function (id) { return document.getElementById(id); };
  var product = null, providers = [];

  function setStep(n) {
    ['p1', 'p2', 'p3'].forEach(function (id, i) { $(id).className = i + 1 < n ? 'done' : (i + 1 === n ? 'now' : ''); });
  }

  function render() {
    var p = product, sold = T.isSold(p), g = T.gradeBadge(p), fv = T.fv;
    var cardLive = providers.some(function (x) { return x.key === 'yoco' && x.live; });
    var FEE = T.deliveryFee;   // flat Courier Guy fee; the server recalculates and saves the real total
    $('co-root').innerHTML =
      '<form class="co" id="co-form" novalidate>' +
        '<div style="display:grid;gap:18px">' +
          '<section class="box"><h2>How would you like to get it?</h2>' +
            '<div class="choice" id="ful">' +
              '<label><input type="radio" name="fulfillmentMethod" value="delivery" checked><span>Courier: ' + T.money(FEE) + ' flat, nationwide<small>The Courier Guy, about 2 days, to your South African address</small></span></label>' +
              '<label><input type="radio" name="fulfillmentMethod" value="collection"><span>Collection: R0<small>North Riding / Kya Sands. Exact location shared on WhatsApp</small></span></label>' +
              '<label><input type="radio" name="fulfillmentMethod" value="meetup"><span>Meetup: ' + T.money(T.meetupFee) + '<small>Saturdays and Sundays only, booked 2 days ahead. Special request fee</small></span></label>' +
            '</div>' +
            '<div id="addr" style="margin-top:16px">' +
              '<div class="field"><label for="c-line1">Street address</label><input id="c-line1" name="line1" autocomplete="address-line1" placeholder="Street and number, unit or complex" maxlength="120"></div>' +
              '<div class="field"><label for="c-line2">Suburb</label><input id="c-line2" name="line2" autocomplete="address-line2" maxlength="80"></div>' +
              '<div class="row2"><div class="field"><label for="c-city">City</label><input id="c-city" name="city" autocomplete="address-level2" maxlength="80"></div>' +
              '<div class="field"><label for="c-post">Postal code</label><input id="c-post" name="postalCode" inputmode="numeric" autocomplete="postal-code" maxlength="4" placeholder="e.g. 2196"></div></div>' +
              '<div class="field"><label for="c-prov">Province</label><select id="c-prov" name="province" autocomplete="address-level1"><option value="">Select province</option>' +
                fv.PROVINCES.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
            '</div>' +
            '<div id="meet" style="margin-top:16px" hidden>' +
              '<div class="field"><label for="c-marea">Meetup area or suburb</label><input id="c-marea" name="meetupArea" maxlength="80" placeholder="e.g. Sandton City"></div>' +
              '<div class="row2"><div class="field"><label for="c-mdate">Preferred date</label><input id="c-mdate" name="meetupDate" type="date"></div>' +
              '<div class="field"><label for="c-mslot">Time slot</label><select id="c-mslot" name="meetupSlot"><option value="">Choose a slot</option>' +
                Object.keys(fv.SLOTS).map(function (k) { return '<option value="' + k + '">' + fv.SLOTS[k] + '</option>'; }).join('') + '</select></div></div>' +
              '<p class="notice"><strong>Meetups are on Saturdays and Sundays only and need 2 days\' notice</strong> so we can get the device to our sales agent. The ' + T.money(T.meetupFee) + ' meetup fee is added to the device price because a meetup is a special request outside our normal sales process. It cannot be cancelled or refunded once the device is with our sales agent.</p>' +
            '</div>' +
          '</section>' +
          '<section class="box"><h2>Your details</h2>' +
            '<div class="field"><label for="c-name">Full name</label><input id="c-name" name="name" autocomplete="name" maxlength="80" required></div>' +
            '<div class="row2"><div class="field"><label for="c-phone">Phone (WhatsApp)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel" placeholder="082 123 4567" maxlength="20" required></div>' +
            '<div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" maxlength="254" required></div></div>' +
            '<div class="field" style="margin-bottom:0"><label for="c-notes">Anything we should know? (optional)</label><textarea id="c-notes" name="notes" maxlength="500"></textarea></div>' +
          '</section>' +
          '<section class="box"><h2>How would you like to pay?</h2>' +
            '<div class="field" style="margin-bottom:0"><div class="choice" id="pay-choice">' +
              (cardLive
                ? '<label><input type="radio" name="pay" value="card" checked><span>Yoco (card)<small>You are taken to a secure Yoco payment page for the total</small></span></label>'
                : '<label style="opacity:.55;cursor:not-allowed"><input type="radio" name="pay" value="card" disabled><span>Yoco (card)<small>Not available yet</small></span></label>') +
              '<label><input type="radio" name="pay" value="eft"' + (cardLive ? '' : ' checked') + '><span>EFT<small>We send our bank details on WhatsApp</small></span></label>' +
              '<label id="cash-opt" hidden><input type="radio" name="pay" value="cash"><span>Cash on collection (meetup or pickup only)<small>Not available for courier delivery.</small></span></label>' +
            '</div></div>' +
            '<p class="notice" id="pay-note" hidden>For a meetup you can pay by Yoco or EFT before we meet, or pay cash at the meetup.</p>' +
          '</section>' +
        '</div>' +
        '<aside class="box" style="position:sticky;top:84px"><h2>Order summary</h2>' +
          '<div class="summary"><div class="thumb">' + T.media(p, true) + '</div><div>' +
            '<strong>' + T.esc(p.brand + ' ' + p.model) + '</strong><div class="card-sub">' + T.esc([p.storage, p.color].filter(Boolean).join(' · ')) + '</div>' +
            '<div class="badges" style="margin-top:6px"><span class="badge ' + g.cls + '">' + T.esc(g.text) + '</span><span class="badge badge-warranty">' + T.esc(T.warrantyBadge(p)) + '</span></div></div></div>' +
          (sold ? '<p class="stock low" style="margin-top:12px">This device is currently out of stock. You can still order it as a pre-order and we will confirm availability on WhatsApp.</p>' : '') +
          '<div class="totals"><div><span>Device price</span><span>' + T.money(p.price) + '</span></div>' +
            '<div><span id="del-label">Delivery (The Courier Guy, about 2 days)</span><span id="del-amt">' + T.money(FEE) + '</span></div>' +
            '<div class="total"><span>Total</span><span id="total-amt">' + T.money(p.price + FEE) + '</span></div></div>' +
          '<button class="btn btn-primary btn-block" type="submit" data-ch="whatsapp" style="margin-top:18px">Place order and continue on WhatsApp</button>' +
          '<button class="btn btn-ghost btn-block" type="submit" data-ch="email" style="margin-top:10px">Place order by email</button>' +
          '<p class="err" id="co-err" role="alert"></p>' +
          '<p class="card-sub" style="margin-top:12px">' + (cardLive ? 'Card payments are taken securely by Yoco. ' : '') + 'Placing the order saves it with us and opens WhatsApp (or your email) with the details filled in. Just press send.</p>' +
        '</aside>' +
      '</form>';

    var form = $('co-form'), channel = 'whatsapp';
    form.querySelectorAll('button[type=submit]').forEach(function (b) { b.addEventListener('click', function () { channel = b.dataset.ch; }); });
    var mdate = $('c-mdate'); mdate.min = fv.minMeetup(); mdate.max = fv.maxMeetup();

    // Courier: address, flat fee, no cash. Collection and meetup: no fee, cash allowed (never for courier).
    function syncFulfil() {
      var m = form.fulfillmentMethod.value, courier = m === 'delivery', fee = courier ? FEE : (m === 'meetup' ? T.meetupFee : 0);
      $('addr').hidden = !courier; $('meet').hidden = m !== 'meetup';
      $('del-label').textContent = courier ? 'Delivery (The Courier Guy, about 2 days)' : (m === 'meetup' ? 'Meetup fee (special request)' : 'Collection');
      $('del-amt').textContent = T.money(fee);
      $('total-amt').textContent = T.money(p.price + fee);
      $('cash-opt').hidden = courier; $('pay-note').hidden = m !== 'meetup';
      if (courier && form.pay.value === 'cash') { var f = form.querySelector('input[name=pay]:not([disabled]):not([value=cash])'); if (f) f.checked = true; }
      fv.clearAll(form);
    }
    // Card (Yoco) goes straight to the Yoco page; EFT/cash hand off to WhatsApp or email.
    function syncPay() {
      var card = form.pay.value === 'card';
      form.querySelector('button[data-ch=whatsapp]').textContent = card ? 'Place order and pay with Yoco' : 'Place order and continue on WhatsApp';
      form.querySelector('button[data-ch=email]').hidden = card;
    }
    // Slot list follows the date: on Sundays we trade until 15:00, so no late slot.
    function syncSlots() {
      var sun = /^\d{4}-\d{2}-\d{2}$/.test(mdate.value) && fv.isSunday(mdate.value), late = form.meetupSlot.querySelector('option[value=late]');
      late.disabled = sun; if (sun && form.meetupSlot.value === 'late') form.meetupSlot.value = '';
    }
    form.addEventListener('change', function (e) { if (e.target.name === 'fulfillmentMethod') syncFulfil(); if (e.target.name === 'meetupDate') syncSlots(); syncPay(); });
    syncPay(); syncFulfil();

    // Same rules as the server (lib/validate.js). Each message appears next to its field.
    var rules = [
      { name: 'line1', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && fv.clean(v).length < 4 ? 'Please enter your street address, with the street number.' : ''; } },
      { name: 'line2', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && fv.clean(v).length < 2 ? 'Please enter your suburb.' : ''; } },
      { name: 'city', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && fv.clean(v).length < 2 ? 'Please enter your city or town.' : ''; } },
      { name: 'province', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && fv.PROVINCES.indexOf(v) < 0 ? 'Please choose your province.' : ''; } },
      { name: 'postalCode', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && !fv.postal(v) ? fv.MSG.postal : ''; } },
      { name: 'meetupArea', check: function (v, d) { return d.fulfillmentMethod === 'meetup' && fv.clean(v, 80).length < 3 ? 'Please tell us the area or suburb where you would like to meet.' : ''; } },
      { name: 'meetupDate', check: function (v, d) { return d.fulfillmentMethod === 'meetup' ? fv.meetupDate(v) : ''; } },
      { name: 'meetupSlot', check: function (v, d) { return d.fulfillmentMethod !== 'meetup' ? '' : (!fv.SLOTS[v] ? 'Please choose a time slot.' : (v === 'late' && /^\d{4}/.test(d.meetupDate) && fv.isSunday(d.meetupDate) ? 'On Sundays we trade until 15:00. Please pick the morning or afternoon slot.' : '')); } },
      { name: 'name', check: function (v) { return fv.clean(v, 80).length < 2 ? fv.MSG.name : ''; } },
      { name: 'phone', check: function (v) { return !fv.phone(v) ? fv.MSG.phone : ''; } },
      { name: 'email', check: function (v) { return !fv.email(v) ? fv.MSG.email : ''; } },
      { el: form.querySelector('#pay-choice'), name: 'pay', check: function (v, d) { return d.fulfillmentMethod === 'delivery' && v === 'cash' ? 'Cash is only available for collection or a meetup. Please choose Yoco (card) or EFT.' : (!v ? 'Please choose how you would like to pay.' : ''); } }
    ];
    // Visible order matches the page so "jump to the first error" lands on the top-most one.
    var order = ['fulfillmentMethod', 'line1', 'line2', 'city', 'postalCode', 'province', 'meetupArea', 'meetupDate', 'meetupSlot', 'name', 'phone', 'email', 'pay'];
    rules.sort(function (a, b) { return order.indexOf(a.name) - order.indexOf(b.name); });
    fv.live(form, rules.filter(function (r) { return !r.el; }));

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('co-err'); err.classList.remove('show');
      if (!fv.run(form, rules)) { err.textContent = 'Please fix the highlighted fields.'; err.classList.add('show'); return; }
      var d = {}; new FormData(form).forEach(function (v, k) { d[k] = typeof v === 'string' ? v.trim() : v; });
      var m = d.fulfillmentMethod, delivery = m === 'delivery';

      var unlock = fv.lock(form);
      var body = {
        productId: product.id, name: fv.clean(d.name, 80), email: d.email, phone: d.phone, notes: fv.clean(d.notes, 500),
        fulfillmentMethod: m, paymentPreference: d.pay,
        paymentMethod: d.pay === 'card' && cardLive ? 'yoco' : 'manual',
        address: delivery ? { line1: fv.clean(d.line1, 120), line2: fv.clean(d.line2, 80), city: fv.clean(d.city, 80), postalCode: d.postalCode, province: d.province } : undefined,
        meetup: m === 'meetup' ? { area: fv.clean(d.meetupArea, 80), date: d.meetupDate, slot: d.meetupSlot } : undefined
      };
      try {
        var r = await T.api('/api/checkout', { method: 'POST', body: body });
        if (r.redirectUrl) { location.href = r.redirectUrl; return; }
        done(r, channel);
      } catch (ex) {
        if (!(ex.fields && fv.apply(form, ex.fields))) { err.textContent = ex.message; err.classList.add('show'); err.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        else { err.textContent = 'Please fix the highlighted fields.'; err.classList.add('show'); }
        unlock();
      }
    });
  }

  function done(r, channel) {
    setStep(3);
    var url = channel === 'email' ? r.mailtoUrl : r.whatsappUrl, ref = r.order.id.slice(0, 8);
    $('co-root').innerHTML =
      '<div class="box ok-box"><div class="tick">' + T.I.tick + '</div><h1>Order placed</h1>' +
      '<p>Thank you. Your order reference is <strong>' + T.esc(ref) + '</strong>. Total: <strong>' + T.money(r.total) + '</strong> (' + (r.deliveryFee ? 'device plus ' + T.money(r.deliveryFee) + ' delivery' : (r.fulfillmentMethod === 'meetup' ? 'device plus ' + T.money(T.meetupFee) + ' meetup fee' : 'collection, no delivery fee')) + '). ' + (r.preOrder ? 'This device is a pre-order, so we will confirm availability with you. ' : '') +
      'Press send in ' + (channel === 'email' ? 'your email app' : 'WhatsApp') + ' so we can confirm payment and delivery.</p>' +
      '<a class="btn btn-primary btn-block" id="open-ch" data-custom ' + (channel === 'email' ? '' : 'data-wa target="_blank" rel="noopener"') + ' href="' + T.esc(url) + '">' + (channel === 'email' ? 'Open email' : 'Open WhatsApp') + '</a>' +
      '<p style="margin-top:14px"><a class="link-arrow" href="/">Back to the shop</a></p></div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // Direct navigation (not window.open) so mobile popup blockers cannot stop it; the button above is the fallback.
    setTimeout(function () { location.href = url; }, 700);
  }

  function missing() {
    $('co-root').innerHTML = '<div class="box ok-box"><h1>Pick a device first</h1><p>We could not find that device. It may have sold.</p><a class="btn btn-primary" href="/#shop">Shop devices</a></div>';
  }

  var b = T.boot || {};
  providers = b.providers || [];
  function go(p) { product = p; render(); T.track('checkout_started', { productId: p.id }); }
  if (b.product) go(b.product);
  else {
    var id = b.id || new URLSearchParams(location.search).get('id');
    if (!id) missing();
    else T.api('/api/products/' + encodeURIComponent(id)).then(go).catch(missing);
  }
})();
</script>
</body>
</html>
