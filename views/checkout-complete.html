<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!--ROBOTS-->
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<!--HEADER-->
<main id="main" class="wrap">
  <div class="form-page"><div class="box ok-box" id="state"><p>Checking your order...</p></div></div>
</main>
<!--FOOTER-->
<script src="/js/site.js"></script>
<script>
(function () {
  var T = window.TTM, q = new URLSearchParams(location.search), status = q.get('status'), id = q.get('order');
  var el = document.getElementById('state');
  var wa = '<a class="btn btn-wa" data-wa href="https://wa.me/27716623565" target="_blank" rel="noopener">WhatsApp us</a>';
  if (status === 'success') {
    el.innerHTML = '<div class="tick">' + T.I.tick + '</div><h1>Payment received</h1><p>Thank you. We are preparing your device for The Courier Guy.</p><p id="ref" class="card-sub"></p><a class="btn btn-primary" href="/">Back to the shop</a>';
  } else if (status === 'cancelled') {
    el.innerHTML = '<h1>Payment cancelled</h1><p>Your order is saved but payment was not completed. Message us on WhatsApp to pay another way.</p>' + wa;
  } else {
    el.innerHTML = '<h1>Payment did not go through</h1><p>Your order is still saved. Message us on WhatsApp and we will arrange another way to pay.</p>' + wa;
  }
  if (id) T.api('/api/orders/' + encodeURIComponent(id)).then(function (o) {
    var r = document.getElementById('ref'); if (r) r.textContent = 'Order ref ' + o.id.slice(0, 8) + ' · ' + T.money(o.amount);
  }).catch(function () {});
})();
</script>
</body>
</html>
